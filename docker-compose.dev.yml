# Infraestructura para desarrollo local. Las apps (api, web) corren en el host con `pnpm dev`.
# Los puertos se publican solo en 127.0.0.1.
name: tli-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tli
      POSTGRES_USER: tli
      POSTGRES_PASSWORD: tli_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tli -d tli']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Antivirus de adjuntos. La primera vez descarga las firmas (puede tardar unos minutos
  # y usa ~1,5 GB de RAM). Mientras no esté listo, los adjuntos quedan "en análisis".
  clamav:
    image: clamav/clamav:1.4
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  pgdata:
  redisdata:
  clamavdata:
